{% extends 'base.html' %}

{% block title %}Criar Publicação - AquaNet{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto pb-20">
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <h1 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
            <i class="fas fa-pen-nib text-blue-600"></i> Criar Publicação
        </h1>
        
        <form id="create-post-form" class="post-form space-y-6" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase">Onde publicar?</label>
                    
                    <a href="{{ url_for('create_community') }}" class="text-[10px] font-bold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-lg transition-colors flex items-center">
                        <i class="fas fa-plus-circle mr-1"></i> Nova Comunidade
                    </a>
                </div>
                
                <div class="relative">
                    <select name="community_slug" id="community-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-slate-700" onchange="updateFormAction(this.value)" required>
                        <option value="" disabled selected>Escolha uma comunidade...</option>
                        {% for community in communities %}
                            <option value="{{ community.slug }}">{{ community.name }}</option>
                        {% endfor %}
                    </select>
                    <i class="fas fa-chevron-down absolute right-4 top-4 text-slate-400 pointer-events-none"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Conteúdo</label>
                <textarea name="content" rows="6" placeholder="Escreva algo interessante..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" required>{{ prefilled_content if prefilled_content else '' }}</textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Imagens (Carrossel)</label>
                <label class="flex items-center justify-center w-full h-32 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-colors group">
                    <div class="text-center">
                        <i class="fas fa-images text-2xl text-slate-300 group-hover:text-blue-500 mb-2 transition-colors"></i>
                        <p class="text-xs text-slate-400 font-medium">Toque para selecionar fotos</p>
                    </div>
                    <input type="file" id="imageInput" multiple accept="image/*" class="hidden">
                </label>
                <div id="hiddenUrlsContainer"></div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all active:scale-95 text-lg flex justify-center items-center">
                Publicar
            </button>
        </form>
    </div>
</div>

<script>
    function updateFormAction(slug) {
        const form = document.getElementById('create-post-form');
        // Atualiza a URL de destino do formulário dinamicamente
        form.action = "/c/" + slug;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
<script>
// IMPORTANTE: Substitua pela palavra exata do seu "Cloud Name" (fica lá no Dashboard inicial do Cloudinary)
const CLOUD_NAME = 'drucooybh'; 
const UPLOAD_PRESET = 'aquanet-carrosel'; // O nome exato que estava na sua foto!

document.getElementById('create-post-form').addEventListener('submit', async function(e) {
    e.preventDefault(); 
    
    const files = document.getElementById('imageInput').files;
    const btn = this.querySelector('button[type="submit"]');
    const container = document.getElementById('hiddenUrlsContainer');
    
    btn.disabled = true;
    
    for (let i = 0; i < files.length; i++) {
        let file = files[i];
        btn.innerText = `Enviando foto ${i+1} de ${files.length}...`;
        
        try {
            // Comprime a foto no próprio celular do usuário antes de enviar
            const compressedFile = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 1080 });
            
            const formData = new FormData();
            formData.append('file', compressedFile);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (data.secure_url) {
                // Cria um input invisível no seu formulário apenas com o Link da imagem
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'image_urls';
                input.value = data.secure_url;
                container.appendChild(input);
            }
        } catch (error) {
            console.error(error);
            alert('Erro ao enviar uma das fotos.');
        }
    }
    
    btn.innerText = 'Salvando publicação no AquaNet...';
    this.submit(); // Agora sim, envia apenas o texto e os links das imagens pro seu Python
});
</script>

{% endblock %}
