{% extends 'base.html' %}

{% block title %}Criar Publicação - AquaNet{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-0 md:px-0 pb-20">
    <div class="bg-white sticky top-0 z-20 border-b border-gray-100 px-4 py-3 flex items-center shadow-sm">
        <a href="{{ url_for('home') }}" class="mr-4 text-gray-800"><i class="fas fa-arrow-left text-lg"></i></a>
        <h1 class="text-lg font-bold text-gray-900">Criar Publicação</h1>
    </div>

    <div class="bg-white p-4 shadow-sm md:rounded-lg mt-0 md:mt-4">
        <!-- O action começa vazio e será preenchido pelo JavaScript com base na comunidade escolhida -->
        <form method="POST" enctype="multipart/form-data" hx-boost="false" class="space-y-4" id="post-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Seletor de Comunidade -->
            <div>
                <label for="community-select" class="block text-xs font-bold text-gray-600 uppercase mb-1">Publicar na comunidade:</label>
                <select id="community-select" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Selecione uma comunidade...</option>
                    {% for comm in communities %}
                        <option value="{{ url_for('community_feed', community_slug=comm.slug) }}">c/{{ comm.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Conteúdo do Post -->
            <div>
                <textarea name="content" rows="4" placeholder="No que você está pensando sobre seu aquário?" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">{{ prefilled_content if prefilled_content else '' }}</textarea>
            </div>

            <!-- Botão de Anexar Mídia -->
            <div>
                <label for="media-input" class="cursor-pointer inline-flex items-center gap-2 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-images text-blue-600 text-lg"></i> Adicionar Fotos ou Vídeos
                </label>
                <input type="file" id="media-input" name="images" multiple accept="image/*,video/*" class="hidden">
                
                <!-- Container das miniaturas com botão de exclusão -->
                <div id="preview-container" class="grid grid-cols-3 gap-2 mt-3"></div>
            </div>

            <div class="pt-2">
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-sm opacity-50 cursor-not-allowed" disabled>
                    Selecione uma comunidade
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const communitySelect = document.getElementById('community-select');
    const postForm = document.getElementById('post-form');
    const submitBtn = document.getElementById('submit-btn');
    const mediaInput = document.getElementById('media-input');
    const previewContainer = document.getElementById('preview-container');
    
    let dt = new DataTransfer();

    // Atualiza o destino do formulário quando o usuário escolhe a comunidade
    communitySelect.addEventListener('change', function() {
        if (this.value) {
            postForm.action = this.value;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            submitBtn.textContent = 'Publicar';
        }
    });

    mediaInput.addEventListener('change', function(e) {
        for (let i = 0; i < this.files.length; i++) {
            dt.items.add(this.files[i]);
        }
        updateInputFiles();
    });

    function updateInputFiles() {
        mediaInput.files = dt.files;
        renderPreviews();
    }

    function renderPreviews() {
        previewContainer.innerHTML = '';
        if (dt.files.length === 0) return;

        Array.from(dt.files).forEach((file, index) => {
            const reader = new FileReader();
            const div = document.createElement('div');
            div.className = 'relative group aspect-square bg-gray-100 rounded-xl overflow-hidden border border-gray-200 shadow-sm';

            reader.onload = function(e) {
                if (file.type.startsWith('video/')) {
                    div.innerHTML = `
                        <video src="${e.target.result}" class="w-full h-full object-cover"></video>
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center pointer-events-none">
                            <i class="fas fa-video text-white text-xl"></i>
                        </div>
                    `;
                } else {
                    div.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'absolute top-1.5 right-1.5 bg-red-600 hover:bg-red-700 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs shadow-md transition-transform active:scale-95';
                deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                
                deleteBtn.onclick = function() {
                    dt.items.remove(index);
                    updateInputFiles();
                };

                div.appendChild(deleteBtn);
            };

            reader.readAsDataURL(file);
            previewContainer.appendChild(div);
        });
    }
</script>
{% endblock %}
